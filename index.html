            <p>Zay “Domo” Artist is an actor, writer and creative strategist based in Los Angeles. His screen work includes HBO’s The Last of Us, Kingdom of the Planet of the Apes and A Quiet Place: Day One.</p>
            <p>Off camera he builds the stories live shows run on — as Assistant Creative Strategist at Kai Cenat’s Streamer University 2, on creative strategy and direction for MemeHouse, and on the freestyle side of Mafiathon 3’s On The Radar.</p>
